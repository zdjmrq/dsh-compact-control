name: Test and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - run: npm test
      - run: npm run build

  release:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@12.2.1
      - name: Verify version tag
        run: node -e 'const p=require("./package.json"); if(process.env.GITHUB_REF_NAME!==`v${p.version}`) throw Error("Tag does not match package.json version")'
      - run: npm ci
      - run: npm publish --access public
      - run: npm pack --ignore-scripts
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" *.tgz --verify-tag --title "$GITHUB_REF_NAME" --notes '使用 DSH 原生上下文压缩功能，仅调整触发自动上下文压缩的阈值。'
